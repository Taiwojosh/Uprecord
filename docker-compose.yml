services:
  postgres:
    image: postgres:16-alpine
    container_name: uprecord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uprecord
      POSTGRES_USER: uprecord_admin
      POSTGRES_PASSWORD: uprecord_secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uprecord_admin -d uprecord"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
